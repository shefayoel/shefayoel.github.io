<!DOCTYPE html>
<!-- // גרסה 1 - 2026-10-24 - דפי השפות וההצטרפות של שפע יואל (GitHub Pages). התוכן נקרא מה-Web app, ומופיע רק אחרי "פורסם" -->
<html lang="{{ page.htmllang | default: 'he' }}" dir="{{ page.dir | default: 'rtl' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שפע יואל</title>
<!-- כרטיס קישור שקט בווצאפ: כותרת ואייקון בלבד -->
<meta property="og:title" content="שפע יואל">
<meta property="og:site_name" content="שפע יואל">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ site.github.url }}/icon.png">
<meta property="og:image:width" content="192">
<meta property="og:image:height" content="192">
<meta name="twitter:card" content="summary">
<meta name="robots" content="noindex">
<link rel="icon" href="{{ site.baseurl }}/icon.png">
<link rel="apple-touch-icon" href="{{ site.baseurl }}/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&family=Heebo:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{ site.baseurl }}/assets/site.css">
</head>
<body>
<main id="app" data-kind="{{ page.kind }}" data-lang="{{ page.l }}" data-ddmm="{{ page.ddmm }}">{{ content }}</main>
<script src="{{ site.baseurl }}/assets/config.js"></script>
<script src="{{ site.baseurl }}/assets/site.js"></script>
</body>
</html>
